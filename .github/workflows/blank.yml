
      - name: Locate and safely extract Kankor Pro
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="Kankor-Pro-Merged-Admin-Center.zip"
          DEST="$RUNNER_TEMP/kankor-extracted"
          mkdir -p "$DEST"

          # Option 1: Use an existing extracted project.
          if [[ -f "kankor-pro/package.json" ]]; then
            echo "Using existing project folder."
            echo "app_root=$GITHUB_WORKSPACE/kankor-pro" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Option 2: Find and validate the ZIP archive.
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Project ZIP not found: $ARCHIVE"
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Checking archive format..."
          file "$ARCHIVE"
          python - "$ARCHIVE" <<'PY'
          import sys, zipfile
          path = sys.argv[1]

          if not zipfile.is_zipfile(path):
              with open(path, "rb") as f:
                  sample = f.read(200)
              print("Invalid ZIP. First bytes:", repr(sample))
              raise SystemExit(
                  "The supplied file is not a valid ZIP archive. "
                  "Upload the actual project ZIP, not a webpage."
              )

          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              names = z.namelist()
              print(f"ZIP validated: {len(names)} entries")
          PY

          # Extract safely; reject paths escaping the destination.
          python - "$ARCHIVE" "$DEST" <<'PY'
          import pathlib, sys, zipfile

          archive = pathlib.Path(sys.argv[1])
          dest = pathlib.Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (dest / item.filename).resolve()
                  if target != dest and dest not in target.parents:
                      raise SystemExit(
                          f"Unsafe ZIP path rejected: {item.filename}"
                      )
              z.extractall(dest)

          print("Extraction completed.")
          PY

          # Locate the real project root instead of assuming one fixed path.
          APP_ROOT=""
          while IFS= read -r candidate; do
            if [[ -f "$candidate/package.json" ]]; then
              APP_ROOT="$(dirname "$candidate")"
              break
            fi
          done < <(find "$DEST" -maxdepth 5 -type f -name package.json)

          if [[ -z "$APP_ROOT" ]]; then
            echo "::error::No package.json found in the extracted project."
            find "$DEST" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "app_root=$APP_ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $APP_ROOT"
